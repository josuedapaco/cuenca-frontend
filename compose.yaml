services:
  backend:
    build: ../backend
    environment:
      DATABASE_PATH: /app/data/cuenca.sqlite
      PUBLIC_ORIGINS: https://cuencany.com,https://www.cuencany.com,http://localhost:8080
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - cuenca_data:/app/data
    restart: unless-stopped
  frontend:
    build: .
    ports:
      - "8080:8080"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  cuenca_data:
